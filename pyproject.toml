[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-template"
version = "0.1.0"
description = "Self-contained project repository template"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["jax", "jaxtyping", "typeguard", "equinox", "optax", "scipy"]

[project.optional-dependencies]
gpu = ["jax[cuda12-local]"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "scipy-stubs",
  "pydocstyle>=6.3",
  "pyyaml>=6",
  "pyright",
  "pydeps",
  "pipdeptree",
  "deptry",
  "snakeviz",
  "psutil",
  "jupyterlab",
  "notebook",
  "ipykernel",
  "mdformat",
  "mdformat-myst",
  "jsonschema>=4.0.0",
  "cryptography>=41.0.0",
  "pydantic>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
typeCheckingMode = "strict"
include = ["./python", "./tests"]
exclude = [
  "**/.*",
  "**/node_modules",
  "**/__pycache__",
  "**/build",
  "**/dist",
  "**/reports",
  "**/experiments",
  "**/*.egg-info",
  "./documents/references",
  "./documents/notes",
  "./scripts",
  "./.worktrees",
]
extraPaths = ["./python", "."]
stubPath = "./python/typings"
reportUnusedVariable = "warning"
reportConstantRedefinition = "warning"
reportMissingTypeStubs = "warning"

[tool.pydocstyle]
match = ".*\\.py"
match_dir = ".*"
ignore = ["D104", "D105", "D107", "D203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
