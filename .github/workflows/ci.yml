# @dependency-start
# contract configuration
# responsibility Defines ci YAML configuration.
# upstream implementation ../../tools/agent-canon/ci/run_all_checks.sh repository CI entrypoint
# upstream implementation ../../tools/agent-canon/ci/check_github_workflows.py parent project quality owner contract
# upstream implementation ../../Makefile ci and pr-check target contracts
# upstream environment ../../docker/requirements.txt generated Python dependency lock and cache key
# upstream environment ../../docker/install_python_dependencies.sh central Python dependency installer
# upstream implementation ../scripts/checkout_agent_canon_submodule.sh private AgentCanon checkout gate
# @dependency-end
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ci:
    name: Repository CI
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: vendor/agent-canon
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout AgentCanon submodule
        env:
          AGENT_CANON_REPO_TOKEN: ""
          AGENT_CANON_REPO_SSH_KEY: ""
        run: bash .github/scripts/checkout_agent_canon_submodule.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y graphviz ripgrep

      - name: Install pip dependencies
        run: bash docker/install_python_dependencies.sh "$PWD"

      - name: Test Template Python
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q
          python -m pyright
          python -m ruff check python tests --select D,E,F,I,UP

      - name: Check Template docs
        if: github.event_name == 'pull_request'
        run: make docs-check

      - name: Check GitHub workflows
        if: github.event_name == 'pull_request'
        run: make github-workflow-check

      - name: Test native C++
        if: github.event_name == 'pull_request'
        run: make cpp-test

      - name: Run full repository CI
        if: github.event_name != 'pull_request'
        env:
          AGENT_CANON_PR_PROJECT_QUALITY_OWNER: parent_ci
        run: make ci

  fresh-clone-acceptance:
    name: Fresh Clone Acceptance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout AgentCanon submodule
        env:
          AGENT_CANON_REPO_TOKEN: ""
          AGENT_CANON_REPO_SSH_KEY: ""
        run: bash .github/scripts/checkout_agent_canon_submodule.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y graphviz ripgrep

      - name: Install pip dependencies
        run: bash docker/install_python_dependencies.sh "$PWD"

      - name: Run fresh clone acceptance
        run: make fresh-clone-check
