name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ci:
    name: Repository CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build library and validation cases
        run: |
          cmake -S . -B workspace/build/project
          cmake --build workspace/build/project --parallel
          cmake -S test/cpp/version -B workspace/build/version
          cmake --build workspace/build/version --parallel
          ctest --test-dir workspace/build/version --output-on-failure

      - name: Check source runner target discovery
        run: python3 -m unittest discover -s test/tools -p test_run_file.py
