name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ci:
    name: Repository CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check repository-owned static contracts
        run: |
          make runtime-independence-check docs-check github-workflow-check
          make docker-check

      - name: Build and run the parent test image
        run: |
          docker build --platform linux/amd64 \
            --tag project-template:ci \
            --file docker/Dockerfile .
          docker run --rm --platform linux/amd64 \
            project-template:ci test/testrunner.sh

      - name: Remove parent test image
        if: always()
        run: docker image rm project-template:ci || true

  fresh-clone-acceptance:
    name: Fresh Clone Acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run descendant fresh-clone acceptance
        run: make fresh-clone-check
