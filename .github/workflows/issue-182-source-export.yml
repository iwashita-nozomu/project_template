name: Issue 182 source export

on:
  push:
    branches:
      - fix/182-remove-agent-definitions

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: issue-182-project-template-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
