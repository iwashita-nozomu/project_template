name: Issue 182 clean patch apply

on:
  push:
    branches:
      - fix/182-remove-agent-definitions

permissions:
  contents: write

concurrency:
  group: issue-182-clean-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace staging history with the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-182.patch.xz.b64 /tmp/issue-182.patch.xz.b64
          base64 --decode /tmp/issue-182.patch.xz.b64 | xz -dc > /tmp/issue-182.patch
          git fetch origin main
          git reset --hard origin/main
          git apply --index /tmp/issue-182.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: remove Agent definitions from template (#182)"
          git push --force origin HEAD:fix/182-remove-agent-definitions
