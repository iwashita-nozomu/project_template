# @dependency-start
# contract workflow
# responsibility Defines docker build YAML configuration.
# upstream environment ../../docker/README.md docker runtime contract
# upstream implementation ../../tools/agent-canon/ci/run_container_pack.py canonical Docker pack runner
# upstream implementation ../scripts/checkout_agent_canon_submodule.sh private AgentCanon checkout gate
# @dependency-end
name: Docker Build

on:
  pull_request:
    paths:
      - "docker/**"
      - "cpp/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".devcontainer/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [ main, master ]
    paths:
      - "docker/**"
      - "cpp/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".devcontainer/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Pack Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout AgentCanon submodule
        env:
          AGENT_CANON_REPO_TOKEN: ""
          AGENT_CANON_REPO_SSH_KEY: ""
        run: bash .github/scripts/checkout_agent_canon_submodule.sh

      - name: Check zero-build contract
        run: bash docker/check_zero_build_contract.sh

      - name: Run one cold build and smoke
        run: bash docker/cold-build-smoke.sh --pull --no-cache --tag project-template:ci-zero-build
