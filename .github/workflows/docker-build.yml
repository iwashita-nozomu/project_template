name: Docker Build

on:
  pull_request:
    paths:
      - "docker/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".devcontainer/**"
      - "tools/check_runtime_independence.py"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".devcontainer/**"
      - "tools/check_runtime_independence.py"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build and Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check repository independence
        run: python3 tools/check_runtime_independence.py

      - name: Check Docker contract
        run: bash docker/check_zero_build_contract.sh

      - name: Run one cold build and smoke
        run: bash docker/cold-build-smoke.sh --pull --no-cache --expect-non-default-id --tag project-template:ci-zero-build
