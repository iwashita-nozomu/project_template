version = 1
full_events = ["push", "workflow_dispatch"]
fallback_profiles = ["base-project"]
routing_owner_paths = [
  "validation/profiles.toml",
  "tools/validation_routing.py",
  "tests/tools/test_validation_routing.py",
  ".github/workflows/ci.yml",
  "Makefile",
  "documents/contracts/template-validation.md",
  "documents/design/validation-routing.md",
]

[[profiles]]
id = "docs"
description = "Markdown, document structure, and local-link correctness"
command = ["make", "docs-check-local"]
paths = [
  "*.md",
  "**/*.md",
  ".markdownlint.json",
]

[[profiles]]
id = "base-project"
description = "Self-contained repository, Python tooling, package build, and unit tests"
command = ["make", "base-project-check-local"]
paths = [
  "AGENTS.md",
  "CLAUDE.md",
  ".codex/**",
  ".agents/**",
  ".claude/**",
  ".vscode/**",
  "agent-canon-static-seed.json",
  "python/**",
  "tests/**",
  "tools/**",
  "pyproject.toml",
  "pyrightconfig.json",
  "responsibility-scope.toml",
]

[[profiles]]
id = "cpp"
description = "CMake configure, C++ build, install, and tests"
command = ["make", "cpp-test-local"]
paths = [
  "CMakeLists.txt",
  "cmake/**",
  "cpp/**",
]

[[profiles]]
id = "github-automation"
description = "GitHub Actions and repository automation contracts"
command = ["make", "github-workflow-check-local"]
paths = [
  ".github/**",
]

[[profiles]]
id = "docker-runtime"
description = "Canonical image, dependency locks, and Dev Container projection"
command = ["make", "docker-contract-check-local"]
paths = [
  ".dockerignore",
  ".devcontainer/**",
  "docker/**",
  "pyproject.toml",
]

[[profiles]]
id = "bootstrap"
description = "Repository initialization and real fresh-clone lifecycle acceptance"
command = ["make", "fresh-clone-check-local"]
paths = [
  "scripts/start_repository.sh",
  "documents/contracts/template-bootstrap.md",
  "documents/design/template-static-seed-import.md",
  "agent-canon-static-seed.json",
  "tools/import_agent_canon_static_seed.py",
  "tests/tools/test_import_agent_canon_static_seed.py",
  "tests/tools/test_legacy_live_agent_canon_migration.py",
  "tests/tools/test_start_repository_script.py",
]
