# @dependency-start
# contract environment
# responsibility Defines the explicit GPU-admission container target and smoke.
# upstream environment ../Dockerfile gpu-runtime target
# upstream design ../../vendor/agent-canon/documents/design/devcontainer/parent-devcontainer-policy.md opt-in GPU profile boundary
# downstream implementation ../../tools/agent-canon/ci/run_container_pack.py canonical pack runner
# @dependency-end
[pack]
name = "gpu-admission"
dockerfile = "docker/Dockerfile"
context = "."
target = "gpu-runtime"
platform = "linux/amd64"
image_tag = "project-template:gpu-admission-runtime-pack"

[smoke]
shell = "/bin/bash"
commands = [
  "python3 --version",
  "nvcc --version | grep -F 'release 12.8'",
  "dpkg-query -W -f='${Version}\\n' cuda-toolkit-12-8 | grep -Fx '12.8.2-1'",
  "dpkg-query -W -f='${Version}\\n' libcudnn9-cuda-12 | grep -Fx '9.8.0.87-1'",
  "dpkg-query -W -f='${Version}\\n' libcudnn9-dev-cuda-12 | grep -Fx '9.8.0.87-1'",
  "dpkg-query -W -f='${Version}\\n' libnccl2 | grep -Fx '2.25.1-1+cuda12.8'",
  "dpkg-query -W -f='${Version}\\n' libnccl-dev | grep -Fx '2.25.1-1+cuda12.8'",
  "python3 -c 'import jax; assert jax.default_backend() == \"gpu\", jax.devices()'",
]

[runtime]
shell = "/bin/zsh"
workdir = "/workspace"
workspace_mount = "/workspace"
gpus = "all"
dependency_profile = "gpu"
