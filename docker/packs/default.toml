# @dependency-start
# contract environment
# responsibility Defines the default container pack configuration.
# upstream environment ../README.md docker runtime guidance
# upstream environment ../Dockerfile default runtime image
# upstream design ../../vendor/agent-canon/CONTAINER_OPERATIONS.md product image and managed devcontainer boundary
# downstream implementation ../../tools/agent-canon/ci/run_container_pack.py canonical pack runner
# @dependency-end
[pack]
name = "default"
dockerfile = "docker/Dockerfile"
context = "."
platform = "linux/amd64"
image_tag = "project-template:default-runtime-pack"

[smoke]
shell = "/bin/bash"
commands = [
  "python3 --version",
  "python3 -m pip --version",
  "cmake --version",
  "ninja --version",
  "ssh -V",
  "docker --version",
  "dot -V",
  "ROOT=/workspace",
  "cmake -S \"$ROOT/cpp\" -B \"$ROOT/build/cpp/docker-smoke\" -DCMAKE_INSTALL_PREFIX=\"$ROOT/.state/cpp-install/docker-smoke\"",
  "cmake --build \"$ROOT/build/cpp/docker-smoke\" --parallel",
  "ctest --test-dir \"$ROOT/build/cpp/docker-smoke\" --output-on-failure",
  "cmake --install \"$ROOT/build/cpp/docker-smoke\"",
  "bash docker/register_safe_directories.sh /workspace",
  "command -v pstree",
  "safe_dirs=\"$(git config --get-all safe.directory || true)\"",
  "printf '%s\\n' \"$safe_dirs\" | grep -Fx /workspace >/dev/null",
  "if [ -d vendor ]; then for vendor_dir in vendor/*; do [ -d \"$vendor_dir\" ] || continue; printf '%s\\n' \"$safe_dirs\" | grep -Fx \"/workspace/${vendor_dir}\" >/dev/null; done; fi",
]

[runtime]
shell = "/bin/zsh"
workdir = "/workspace"
workspace_mount = "/workspace"
