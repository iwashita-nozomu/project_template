# Parent-repository test contract.
# TOML comments are intentional: keep the command list reviewable and local.
# Phase labels support focused execution. Docker builds an image-local Git
# snapshot and runs both phases through the same disposable `all` boundary.

format = "parent-test-list-v1"
environment_owner = "invocation-environment"
responsibility = "parent-repository"

[[tests]]
name = "documentation-links"
phase = "static"
command = ["python3", "tools/check_markdown_links.py"]
working_directory = "."

[[tests]]
name = "github-workflows"
phase = "static"
command = ["python3", "tools/check_github_workflows.py"]
working_directory = "."

[[tests]]
name = "docker-contract"
phase = "static"
command = ["bash", "docker/check_zero_build_contract.sh"]
working_directory = "."

[[tests]]
name = "repository-tooling"
phase = "portable"
command = ["python3", "-m", "pytest", "-q", "test/tools"]
working_directory = "."

[[tests]]
name = "cpp"
phase = "portable"
# Keep the complete configure/build/test sequence in one entry so a failed
# configure or build is reported as the parent C++ test, not as an opaque step.
command = ["bash", "-lc", "cmake --preset test && cmake --build --preset test --parallel && ctest --preset test"]
working_directory = "."
