# @dependency-start
# contract registry
# responsibility Defines top-level responsibility scopes and protecting tools for this repository.
# upstream design AGENTS.md parent repository runtime entrypoint
# upstream design vendor/agent-canon/documents/design/responsibility-scope-management.md responsibility scope policy
# upstream design vendor/agent-canon/templates/documents/responsibility-scope.template.toml starter manifest for template-derived repositories
# downstream implementation tools/agent-canon/agent_tools/responsibility_scope.py validates this manifest
# downstream implementation tools/agent-canon/sync_agent_canon.sh repairs AgentCanon root views
# @dependency-end

catalog_kind = "agent_canon_responsibility_scope"
version = 1

owner_values = [
  "agent-canon",
  "template",
  "derived-project",
  "github",
  "external-vendor",
]

class_values = [
  "shared_runtime",
  "shared_policy",
  "active_contract",
  "durable_state",
  "evidence",
  "tooling",
  "github_surface",
  "external_dependency",
]

# Opt-in source surfaces for dependency-header checks.  These are the active
# Template-owned paths touched by repository changes; AgentCanon source headers
# are checked from the vendored runtime surface.
dependency_header_surfaces = [
  ".github/**",
  ".codex/**",
  ".devcontainer/**",
  ".vscode/**",
  "docker/**",
  "documents/**",
  "scripts/**",
  "tests/**",
  "README.md",
  "QUICK_START.md",
  "responsibility-scope.toml",
]

# These entries are the current top-level responsibilities. Retired root views
# such as `agents/`, `.agents/`, and `evidence/` are intentionally absent.
required_coverage = [
  ".codex",
  ".devcontainer",
  ".github",
  ".vscode",
  "cpp",
  "documents",
  "docker",
  "experiments",
  "memory",
  "notes",
  "python",
  "references",
  "reports",
  "rust",
  "scripts",
  "tests",
  "tools",
  "vendor/agent-canon",
  ".dockerignore",
  ".gitignore",
  ".gitmodules",
  ".markdownlint.json",
  "AGENTS.md",
  "LICENSE",
  "Makefile",
  "QUICK_START.md",
  "README.md",
  "pyproject.toml",
  "pyrightconfig.json",
  "responsibility-scope.toml",
  "vendor/README.md",
]

[[scope]]
id = "agent-canon-runtime-view"
owner = "agent-canon"
class = "shared_runtime"
description = "The pinned AgentCanon source and its three active parent runtime projections."
paths = [
  "vendor/agent-canon/**",
  "tools/agent-canon",
  "tools/agent-canon/**",
  ".codex/config.toml",
  "AGENTS.md",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/responsibility_scope.py",
  "tools/agent-canon/sync_agent_canon.sh",
]
issues = []

[[scope]]
id = "template-active-contract"
owner = "template"
class = "active_contract"
description = "Template-owned entrypoints, regular overlays, implementation profiles, tests, and project tooling."
paths = [
  ".agent-canon/**",
  ".codex/**",
  ".devcontainer/**",
  ".vscode/**",
  "cpp/**",
  "documents/**",
  "docker/**",
  "scripts/**",
  "python/**",
  "rust/**",
  "tests/**",
  "tools/**",
  "vendor/README.md",
  ".dockerignore",
  ".gitignore",
  ".gitmodules",
  ".markdownlint.json",
  "LICENSE",
  "Makefile",
  "QUICK_START.md",
  "README.md",
  "pyproject.toml",
  "pyrightconfig.json",
  "responsibility-scope.toml",
]
exclude_paths = [
  ".codex/config.toml",
  "tools/agent-canon",
  "tools/agent-canon/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/responsibility_scope.py",
  "tools/agent-canon/agent_tools/run_repo_dependency_review.sh",
  "tools/agent-canon/ci/container_config.py",
]
issues = []

[[scope]]
id = "github-automation"
owner = "github"
class = "github_surface"
description = "Repository-local GitHub Actions, issue templates, PR templates, and automation scripts."
paths = [
  ".github/**",
]
protecting_tools = [
  "tools/agent-canon/ci/check_github_workflows.py",
]
issues = []

[[scope]]
id = "project-durable-state"
owner = "derived-project"
class = "durable_state"
description = "Project-specific experiments, notes, references, memory, and retained reports."
paths = [
  "experiments/**",
  "memory/**",
  "notes/**",
  "references/**",
  "reports/**",
]
protecting_tools = [
  "tools/agent-canon/agent_tools/responsibility_scope.py",
]
issues = []
